# 独立管理后台（admin-ui + admin-web）。默认仅绑定本机回环，由反向代理把
# /admin/* 转发过来。
#
# **对外端口归 admin-ui**：它是后台前端（SvelteKit），接管 `/admin/*`——已迁的
# 页面自己渲染，仍属 Python 的路径与尚未迁完的页面转发给 admin-web。
# admin-web 只在 compose 网络内可达，排查时用 `127.0.0.1:8011` 直连。
services:
  admin-ui:
    build:
      context: ..
      dockerfile: services/admin_ui/Dockerfile
    image: webagent/admin-ui:0.1.0
    container_name: webagent-admin-ui
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    ports:
      - "127.0.0.1:8001:3000"
    environment:
      ADMIN_API_BASE_URL: "http://admin-web:8001"
      # SvelteKit 用它推导自己的 origin。**必须设**：adapter-node 在没有
      # PROTOCOL_HEADER 时默认按 https 推导，而我们这里是 http 直连——
      # 推导出来的 origin 与浏览器发来的对不上，SvelteKit 自带的 CSRF 校验
      # 会把所有表单 POST 拒掉（"Cross-site POST form submissions are
      # forbidden"），登录直接失败。
      ORIGIN: ${ADMIN_PUBLIC_BASE_URL:-http://127.0.0.1:8001}
      PORT: "3000"
      HOST: "0.0.0.0"
    depends_on:
      - admin-web
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  admin-web:
    build:
      context: ..
      dockerfile: Dockerfile.admin
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: webagent/admin-web:0.1.0
    container_name: webagent-admin
    restart: unless-stopped
    # 小内存测试机默认上限；正式环境按容量另行配置。
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    ports:
      # 对外端口交给 admin-ui（见上）；这里只留一个回环口供排查与回退。
      - "127.0.0.1:8011:8001"
    env_file:
      - ../.env
    environment:
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      ADMIN_PUBLIC_BASE_URL: ${ADMIN_PUBLIC_BASE_URL:-http://127.0.0.1:8001}
      ADMIN_SESSION_COOKIE_SECURE: ${ADMIN_SESSION_COOKIE_SECURE:-false}
      ADMIN_WEB_PORT: "8001"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
