# 本地起一个 studio（skill-service §16 的「集成」层）。
#
# 用途：本地开发时让 web_agent 能真的调 skill_exec，不用改代码。
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   # 然后在 web_agent 的 .env 里写：
#   #   STUDIO_EXEC_ADDR=127.0.0.1:9000
#   #   STUDIO_EXEC_REQUIRED=true
#
# Docker 可用时从部署目录启动；国内网络可先配置镜像加速源，或分别拉取固定版本
# 的 studio 基础镜像后再构建。
#
# 注意这里是**开发配置**：为了便于本地调试，没有启用完整的只读 rootfs 和
# 网络隔离。需要验证隔离执行时使用 `docker-compose.lab.yml`。
services:
  studio:
    build:
      context: ..
      dockerfile: services/studio/Dockerfile
      args:
        # 国内构建时换成镜像源：https://mirrors.aliyun.com/pypi/simple/
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        # 国内构建时换成镜像源：mirrors.aliyun.com
        APT_MIRROR: ${APT_MIRROR:-}
    image: webagent/studio:2.0.0
    container_name: webagent-studio
    ports:
      - "9000:9000"
    environment:
      STUDIO_HOST: "0.0.0.0"
      STUDIO_PORT: "9000"
      STUDIO_MAX_CONCURRENCY: "4"
      STUDIO_MAX_QUEUE: "16"
      STUDIO_MAX_TIMEOUT_MS: "60000"
      STUDIO_PROFILE: "fast"
      STUDIO_VERSION: "2.0.0"
    # 脚本的工作目录。给它一个独立卷，免得写满开发机的磁盘。
    tmpfs:
      - /tmp:size=128m
    restart: unless-stopped
