# 本地起一个 studio（skill-service §16 的「集成」层）。
#
# 用途：本地开发时让 web_agent 能真的调 skill_exec，不用改代码。
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   # 然后在 web_agent 的 .env 里写：
#   #   STUDIO_EXEC_ADDR=127.0.0.1:9000
#   #   STUDIO_EXEC_REQUIRED=true
#
# **本环境没有 Docker，这份文件没有实测过。**
#
# 注意这里**故意**没有照搬 K8s 那套加固（只读 rootfs、非 root、禁出网）——
# docker compose 跑在开发机上，那些限制会让本地调试很别扭。**生产部署看
# deploy/k8s/，不要拿这份当生产配置。**
services:
  studio:
    build:
      context: ..
      dockerfile: services/studio/Dockerfile
      args:
        # 国内构建时换成镜像源：https://mirrors.aliyun.com/pypi/simple/
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        # 国内构建时换成镜像源：mirrors.aliyun.com
        APT_MIRROR: ${APT_MIRROR:-}
    image: webagent/studio:1.0.0
    container_name: webagent-studio
    ports:
      - "9000:9000"
    environment:
      STUDIO_HOST: "0.0.0.0"
      STUDIO_PORT: "9000"
      STUDIO_MAX_CONCURRENCY: "4"
      STUDIO_MAX_QUEUE: "16"
      STUDIO_MAX_TIMEOUT_MS: "60000"
      STUDIO_PROFILE: "fast"
      STUDIO_VERSION: "1.0.0"
    # 脚本的工作目录。给它一个独立卷，免得写满开发机的磁盘。
    tmpfs:
      - /tmp:size=128m
    restart: unless-stopped
