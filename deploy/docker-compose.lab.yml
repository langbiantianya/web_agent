# 完整的一体化实验栈：web_agent + studio + dispatcher（skill-service §7、§11、§13）。
#
# 与同目录的 `docker-compose.yml`（只有 studio）不同，这里把**两个服务**都拉起来，
# 并且**真的把 studio 的出网掐掉**——这是 §7「禁出网」那条要求在 Docker 上唯一
# 能落地的做法：
#
# ```text
#   lab_egress（普通网络，有默认网关）
#       └── web_agent  ← 需要出网调 LLM
#
#   lab_internal（internal: true，**没有**默认网关）
#       ├── web_agent
#       └── studio    ← 只有这一张网卡，出不去
# ```
#
# studio 只挂在 ``lab_internal`` 上：它能跟 web_agent 说话（gRPC），
# 但**没有任何路由能出网**——要外传数据没有路可走。
#
# ## 用法
#
# ```sh
# # 宿主机上先备好数据库（已有 MySQL/Redis 时跳过）
# docker run -d --name mysql ...   # 见 /docker/docker-compose.yml
#
# # 配置
# cp .env.example .env && $EDITOR .env
#
# # 先构建一次性沙箱镜像（dispatcher 按目录名引用它）
# docker build -f services/sandbox/Dockerfile -t webagent/studio-sandbox:1.0.0 .
#
# # 起（studio + dispatcher + web_agent）
# docker compose -f deploy/docker-compose.lab.yml up -d --build
# ```
#
# MySQL / Redis 用**宿主机已发布的端口**接入（``host.docker.internal``），
# 而不是给 compose 加一个数据库服务——这台机器上数据库已经跑着了。

name: web-agent-lab

services:
  studio:
    build:
      context: ..
      dockerfile: services/studio/Dockerfile
      args:
        # 国内构建时换成镜像源：https://mirrors.aliyun.com/pypi/simple/
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        # 国内构建时换成镜像源：mirrors.aliyun.com
        APT_MIRROR: ${APT_MIRROR:-}
    image: webagent/studio:2.0.0
    container_name: studio
    restart: unless-stopped
    # **零凭据**：这里只有 STUDIO_* 自己的运行参数。
    # studio 执行的是模型指定的代码，容器里只要有一个能用的 key，
    # 一次提示词注入就够把它偷出去（§7 的重点）。
    environment:
      STUDIO_HOST: "0.0.0.0"
      STUDIO_PORT: "9000"
      STUDIO_MAX_CONCURRENCY: "2"
      STUDIO_MAX_QUEUE: "4"
      STUDIO_MAX_TIMEOUT_MS: "30000"
      STUDIO_MAX_STDOUT_BYTES: "1048576"
      STUDIO_MAX_STDERR_BYTES: "262144"
      STUDIO_DRAIN_TIMEOUT_SEC: "30"
      # 指标端点（skill-service §12.1）：/metrics 走 Prometheus 文本格式。
      STUDIO_METRICS_PORT: "9090"
      # 脚本进程的 oom_score_adj（skill-service §13.2）：容器内存被打爆时，
      # 被 OOM killer 挑中的是**脚本**而不是 studio 自己。
      STUDIO_OOM_SCORE_ADJ: "1000"
      # isolated 档（skill-service §2.4、§8.4）：这些技能码走 isolated 档
      # （每次执行起一次性容器），并有**自己的**并发池与等待队列。
      # **参考实现没有部署容器运行时**——填了技能码，它们会拿到明确的
      # FAILED_PRECONDITION，而不是悄悄退回 fast 档。默认留空 = 全部走 fast。
      STUDIO_ISOLATED_SKILL_CODES: ""
      STUDIO_ISOLATED_MAX_CONCURRENCY: "2"
      STUDIO_ISOLATED_MAX_QUEUE: "4"
      # 可选技能级并发配额：格式 skill-a=1,skill-b=2。
      STUDIO_SKILL_QUOTAS: ""
      STUDIO_SKILL_QUEUE: "4"
      # 成本费率是部署计价单位，不写死货币。真实 CPU/内存由沙箱 cgroup 采集；
      # 这里只负责把资源换算成账单可聚合的成本单位。
      STUDIO_CPU_SECOND_RATE: "0"
      STUDIO_MEMORY_GIB_SECOND_RATE: "0"
      STUDIO_SANDBOX_START_RATE: "0"
      # 沙箱调度器的地址；空 = 本实例没有 isolated 运行时。Phase 1 起
      # `studio-dispatcher` 会作为独立容器提供它。
      STUDIO_ISOLATED_DISPATCHER_ADDR: "studio-dispatcher:9100"
      # 镜像目录：`目录名=image@sha256:...`。调用方只能按目录名请求。
      STUDIO_ISOLATED_IMAGES: "default=webagent/studio-sandbox:1.0.0"
      STUDIO_ISOLATED_STARTUP_BUDGET_MS: "15000"
      STUDIO_PROFILE: "fast"
      STUDIO_VERSION: "2.0.0"
      TMPDIR: "/tmp"
    # 只挂在内部网络里——**没有出网路径**（§7 / §11.1）。
    depends_on:
      studio-dispatcher:
        condition: service_healthy
    networks:
      - lab_internal
    ports:
      # 只绑回环：外网要连 studio 的话从 web_agent 走，不直接暴露。
      - "127.0.0.1:9000:9000"
      # 指标端点（skill-service §12.1）：抓取用，同样只绑回环。
      - "127.0.0.1:9090:9090"
    # 脚本的工作目录。tmpfs 占的是容器内存，所以单独限额。
    tmpfs:
      - /tmp:size=64m
    # §7 的容器级加固，逐条对着来。
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 一次性沙箱的调度器（skill-service §2.4）。
  #
  # **它持有 Docker socket，但从不执行 content**——真正跑脚本的是一次性沙箱容器
  # （services/sandbox/Dockerfile）。studio 容器里没有 socket、没有 kubeconfig。
  #
  # 以 root 跑是为了挂 /var/run/docker.sock；生产建议换成 docker-socket-proxy
  # 并把 API 收敛成 create/start/logs/remove（见 services/dispatcher/Dockerfile）。
  studio-dispatcher:
    build:
      context: ..
      dockerfile: services/dispatcher/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: webagent/studio-dispatcher:1.0.0
    container_name: studio-dispatcher
    restart: unless-stopped
    environment:
      DISPATCHER_HOST: "0.0.0.0"
      DISPATCHER_PORT: "9100"
      DISPATCHER_MAX_INFLIGHT: "2"
      DISPATCHER_MAX_TIMEOUT_MS: "60000"
      # 镜像目录：调用方只能按目录名请求。ref 里最好钉 digest。
      # **要与 studio 的 STUDIO_ISOLATED_IMAGES 保持一致**：前者是 Health 上报，
      # 后者是实际执行用的 ref。
      DISPATCHER_IMAGES: "default=webagent/studio-sandbox:1.0.0"
      # 本地刚构建的镜像通常只有 tag；生产必须改为 image@sha256:<digest> 并设 true。
      DISPATCHER_REQUIRE_DIGEST: "false"
      # 自定义 seccomp 与镜像预热默认开启。profile 会由 dispatcher 复制到
      # Docker daemon 可见的 payload 目录后传给容器。
      DISPATCHER_REQUIRE_CUSTOM_SECCOMP: "true"
      DISPATCHER_PREWARM_IMAGES: "true"
      # 所有 studio 实例共享本 dispatcher 的准入控制：
      # 格式 tenant=并发数、skill=并发数、tenant/skill=成本单位上限。
      DISPATCHER_TENANT_QUOTAS: ""
      DISPATCHER_SKILL_QUOTAS: ""
      DISPATCHER_TENANT_BUDGETS: ""
      DISPATCHER_SKILL_BUDGETS: ""
      # payload 目录：必须对 Docker daemon 可见（下面从宿主机同路径挂进来）。
      DISPATCHER_PAYLOAD_DIR: "/var/lib/studio-payloads"
    networks:
      - lab_internal
    volumes:
      # 只挂进 dispatcher，**不挂进 studio**。
      - /var/run/docker.sock:/var/run/docker.sock
      # payload 目录：dispatcher 写、沙箱只读挂载。必须和宿主机同路径，
      # 否则 Docker daemon 解析容器 bind mount 时找不到文件。
      - /var/lib/studio-payloads:/var/lib/studio-payloads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:9100/health', timeout=2).status == 200"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web-agent:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: webagent/web-agent:1.0.0
    container_name: web-agent
    restart: unless-stopped
    # 凭据从 .env 读，**不烘进镜像**。
    env_file:
      - ../.env
    environment:
      # 容器里跑要连宿主机上已发布的 MySQL / Redis。
      # 数据库口令只从部署环境注入，不能写进仓库或镜像。
      DATABASE_URL: "mysql+asyncmy://${MYSQL_USER:-root}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@host.docker.internal:3306/${MYSQL_DATABASE:-webagent}?charset=utf8mb4"
      REDIS_URL: "redis://host.docker.internal:6379/0"
      # studio 在内部网络里，服务名就是 DNS 名。
      STUDIO_EXEC_ADDR: "studio:9000"
      STUDIO_EXEC_REQUIRED: "true"
      STUDIO_EXEC_LB_POLICY: "round_robin"
      CHECKPOINT_SQLITE_PATH: "/tmp/checkpoints.db"
      TMPDIR: "/tmp"
    networks:
      - lab_internal
      - lab_egress
    ports:
      - "8000:8000"
    extra_hosts:
      # Linux 上让容器能用宿主机名访问宿主机已发布的端口。
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:size=64m
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 640m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # 有默认网关——web_agent 要靠它出网调 LLM。
  lab_egress:
    driver: bridge
  # **没有**默认网关：挂在这张网上的容器出不去。
  lab_internal:
    driver: bridge
    internal: true
