# studio 的 Deployment（skill-service §13.1）。
#
# **逐条对应文档里的加固要求**（§7、§13.1）：
#
# | 要求 | 落在哪 |
# | --- | --- |
# | 零凭据 | 容器里没有任何 env/secret —— 只有 STUDIO_* 这几个运行参数 |
# | 只读 rootfs | `readOnlyRootFilesystem: true`（+ `/tmp` 挂一个有限额的 tmpfs） |
# | 非 root | `runAsNonRoot: true` + `runAsUser: 1000` |
# | 无提权 | `allowPrivilegeEscalation: false` |
# | drop capabilities | `capabilities.drop: ["ALL"]` |
# | seccomp | `seccompProfile.type: RuntimeDefault` |
# | pidsLimit | `pidsLimit: 256`（fork 炸弹的容器级兜底） |
# | 禁出网 | 见 `studio-networkpolicy.yaml` |
# | 探针 | startup / liveness / readiness，都调 `Health` |
#
# **replicas ≥ 2**：studio 挂了脚本能力就没了（主设计 §22.12 第 2 条）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio
  labels:
    app: studio
    app.kubernetes.io/name: studio
    app.kubernetes.io/component: studio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studio
  template:
    metadata:
      labels:
        app: studio
        app.kubernetes.io/name: studio
    spec:
      # 容器级与 Pod 级的安全上下文。**两处都要写**：只写一处会出现
      # 「镜像里是 root、Pod 说非 root」之类的错配。
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # 必须大于 studio 的 drain_timeout（默认 30 秒），否则 K8s 会在 drain
      # 完成之前 SIGKILL 掉进程——在跑的执行就被腰斩了。
      terminationGracePeriodSeconds: 40
      # fork 炸弹的容器级兜底。代码里还有 RLIMIT_NPROC，两道防线。
      pidsLimit: 256
      containers:
        - name: studio
          # 镜像版本固定。**生产里应当再钉到 digest**（`image@sha256:...`）——
          # 只钉 tag 的话，tag 被重新推送就等于换了镜像。
          image: registry.example.com/webagent/studio:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9000
            # 指标端点（skill-service §12.1）：Prometheus 抓这个端口。
            # **它也在 NetworkPolicy 的管辖下**——不放行就抓不到，见
            # studio-networkpolicy.yaml 里那条 ingress 规则。
            - name: metrics
              containerPort: 9090
          # **零凭据**：这里只有 studio 自己的运行参数，没有任何 API key、
          # 数据库口令、token。§7 的重点就在这一行——studio 容器里只要有
          # 一个能用的凭据，一次提示词注入就够把它偷出去。
          env:
            - name: STUDIO_HOST
              value: "0.0.0.0"
            - name: STUDIO_PORT
              value: "9000"
            - name: STUDIO_MAX_CONCURRENCY
              value: "4"
            - name: STUDIO_MAX_QUEUE
              value: "16"
            - name: STUDIO_MAX_TIMEOUT_MS
              value: "60000"
            - name: STUDIO_MAX_STDOUT_BYTES
              value: "1048576"
            - name: STUDIO_MAX_STDERR_BYTES
              value: "262144"
            - name: STUDIO_DRAIN_TIMEOUT_SEC
              value: "30"
            # 指标端点的端口（skill-service §12.1）；设成 "0" 就不启用。
            - name: STUDIO_METRICS_PORT
              value: "9090"
            # isolated 档（skill-service §2.4、§8.4）：这些技能码走 isolated 档
            # （每次执行起一次性容器），并有**自己的**并发池与等待队列。
            # **参考实现没有部署容器运行时**——填了技能码，它们会拿到明确的
            # FAILED_PRECONDITION，而不是悄悄退回 fast 档。默认留空 = 全部走 fast。
            - name: STUDIO_ISOLATED_SKILL_CODES
              value: ""
            - name: STUDIO_ISOLATED_MAX_CONCURRENCY
              value: "2"
            - name: STUDIO_ISOLATED_MAX_QUEUE
              value: "4"
            # 沙箱调度器的地址（skill-service §2.4 / D1）。空 = 本实例没有
            # isolated 运行时；配了技能码却没配它会在启动时失败（fail fast）。
            - name: STUDIO_ISOLATED_DISPATCHER_ADDR
              value: ""
            # 镜像目录：`目录名=image@sha256:...`。调用方只能按目录名请求。
            - name: STUDIO_ISOLATED_IMAGES
              value: ""
            - name: STUDIO_ISOLATED_STARTUP_BUDGET_MS
              value: "15000"
            # 脚本进程的 oom_score_adj（skill-service §13.2）：调到 1000，
            # 容器内存被打爆时被 OOM killer 挑中的是**脚本**而不是 studio 自己。
            - name: STUDIO_OOM_SCORE_ADJ
              value: "1000"
            - name: STUDIO_PROFILE
              value: "fast"
            - name: STUDIO_VERSION
              value: "2.0.0"
            - name: TMPDIR
              value: "/tmp"
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          # 探针用 exec 调**我们自己的** Health 方法：K8s 的 grpc: 探针发的是
          # gRPC 健康检查标准协议（grpc.health.v1.Health/Check），跟契约里的
          # Health 对不上（§13.3）。
          startupProbe:
            exec:
              command:
                - python
                - -m
                - services.studio.healthcheck
                - --addr
                - 127.0.0.1:9000
                - --require-ready
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - python
                - -m
                - services.studio.healthcheck
                - --addr
                - 127.0.0.1:9000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - services.studio.healthcheck
                - --addr
                - 127.0.0.1:9000
                - --require-ready
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # 只读 rootfs 下，脚本的工作目录只能落在这上面。medium: Memory
            # 是 tmpfs——**它占的是容器的内存**，所以要单独限额（§7 的备注）。
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                # 真正的 drain 由 SIGTERM 触发（先摘 readiness，再等在跑的执行
                # 结束）。这里只睡几秒，给 K8s 摘掉 Terminating 的 Pod、
                # 以及在途请求收尾留时间。
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
# 至少留一个实例在跑：studio 全下线 = 脚本能力整个消失。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: studio
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: studio
