# studio 的 Service——**headless**（skill-service §13.4）。
#
# ## 为什么必须是 headless
#
# gRPC 用 HTTP/2 **长连接**。普通 ClusterIP Service 只有一个 VIP，客户端建的那
# 条连接会被 kube-proxy 固定到**某一个 Pod**，之后永远只跟它说话——加 Pod 扩容
# 之后流量一点都不过去。**扩缩容等于白扩。**
#
# headless（`clusterIP: None`）没有 VIP，DNS 会把**所有**后端 Pod 的 IP 全部返
# 回。配合客户端的 ``round_robin`` 策略（``STUDIO_EXEC_LB_POLICY``，默认就是
# 它），请求才会真的轮询到各个 Pod 上。
#
# 客户端那一侧的实现见 ``app/core/studio.py`` 的 ``channel_target()``：它给地址
# 加 ``dns:///`` 前缀，让 gRPC 用 DNS 解析器拿到全部 A 记录——不加这个前缀，
# 轮询策略是空转的。
#
# **不要**把它改成普通 ClusterIP Service 就以为扩缩容生效了——那是最容易踩、
# 也最难发现的坑。
apiVersion: v1
kind: Service
metadata:
  name: studio
  labels:
    app: studio
    app.kubernetes.io/name: studio
spec:
  # headless 的关键：不要 VIP。
  clusterIP: None
  selector:
    app: studio
  ports:
    - name: grpc
      port: 9000
      targetPort: grpc
    # 指标端口（skill-service §12.1）。headless 没有 VIP，Prometheus 用
    # pod 自己的地址抓就行——加这个端口是为了让 `studio:9090` 能解析到所有
    # 后端 Pod，轮询式抓取才成立。
    - name: metrics
      port: 9090
      targetPort: metrics
