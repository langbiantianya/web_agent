# studio 的网络策略（skill-service §7、§11.1、§15）。
#
# ## 两条方向是不对称的
#
# - **入向**：必须放开——web_agent 要能连上来（gRPC 9000）。
# - **出向**：**全禁**。studio 跑的是模型指定的代码，它没有任何理由向外发
#   连接：不能拉取外网资源，也不能把脚本读到的数据外传。
#
# 「禁出网」是防数据外传的那道防线：脚本的 stdout 会回灌进模型的 prompt，
# 再由模型写进最终答案——一个能出网的脚本就等于一条完整的泄露通道。
#
# ## 提醒
#
# NetworkPolicy 依赖 CNI 支持（Calico / Cilium 等）。**默认集群里没装 CNI 的
# 话，这份策略不会生效**——Pod 照样能出网。要确认的话见同目录的 README。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studio
  labels:
    app: studio
spec:
  podSelector:
    matchLabels:
      app: studio
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 只放行 web_agent 过来的 gRPC。
    - from:
        - namespaceSelector:
            matchLabels:
              # 按你自己的命名空间标签改。
              name: web-agent
          podSelector:
            matchLabels:
              # 按你自己的标签改。
              app: web-agent
      ports:
        - protocol: TCP
          port: 9000
  # 出向：一律拒绝（空列表 = 什么都不允许）。
  egress: []
